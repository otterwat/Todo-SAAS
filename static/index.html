<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TODO</title>
	<link rel="stylesheet" href="/static/style.css">
	<link rel="icon" href="/static/favicon.ico">
</head>
<body>
	<main>

		<!-- not logged in view -->
		<section id="auth-view" hidden>
			<h1>TODO</h1>

			<div class="tabs">
				<button type="button" id="tab-login" class="tab active">Log in</button>
				<button type="button" id="tab-signup" class="tab">Sign up</button>
			</div>

			<form id="login-form" class="stack">
				<input id="login-username" type="text" placeholder="Username"
					   autocomplete="username" required>
				<input id="login-password" type="password" placeholder="Password"
					   autocomplete="current-password" required>
				<button type="submit">Log in</button>

				<p id="login-notes" class="notes">
					global list sign in information:<br>
					username: global list<br>
					password: admin123
				</p>
			</form>

			<form id="signup-form" class="stack" hidden>
				<input id="signup-username" type="text" placeholder="Choose a username (3+ characters)"
					   autocomplete="username" minlength="3" maxlength="50" required>
				<input id="signup-password" type="password" placeholder="Choose a password (8+ characters)"
					   autocomplete="new-password" minlength="8" maxlength="128" required>
				<button type="submit">Create account</button>
			</form>

			<p id="auth-message" class="error"></p>
		</section>

		<!-- logged in view-->
		<section id="todo-view" hidden>

			<!-- 1. Header -->
			<div class="header-row">
				<h1>My TODO List</h1>
				<div>
					<span id="current-user"></span>
					<button type="button" id="logout-button" class="secondary">Log out</button>
				</div>
			</div>

			<form id="add-form">
				<input id="todo-input" type="text" placeholder="What needs doing?"
					   maxlength="200" required>
				<button type="submit">Add</button>
			</form>
			<br>

			<div id="notes-section">
				<label for="notes-input">Notes</label>
				<textarea id="notes-input" rows="3" maxlength="250"
						  placeholder="Write notes for yourself here..."></textarea>
				<div class="notes-row">
					<button type="button" id="notes-save" class="secondary">Save notes</button>
					<span id="notes-status"></span>
				</div>
			</div>

			<p id="message" class="error"></p>
			<ul id="todo-list"></ul>

		</section>

	</main>

	<!-- SCRIPTS -->
	<!-- Confetti -->
	<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
	<!-- index.js: Change 'v=...' +1 every time a hard update is needed -->
	<script src="/static/script.js?v=6"></script>
	<link rel="stylesheet" href="/static/style.css?v=6">
</body>
</html>
